openapi: 3.1.0
info:
  title: Solaris Academy API
  version: 3.0.0
  summary: Zero-Eval Python AST Auto-Grader, System Design Capacity Estimator, SM-2 Scheduler & HMAC-SHA256 Certificate Registry
  description: |
    Production Python 3.12 FastAPI backend powering Solaris Academy v3.0.
    Provides deterministic zero-eval AST sandbox grading with bounded execution budgets,
    FAANG back-of-the-envelope System Design capacity & bottleneck estimation,
    SuperMemo-2 spaced-repetition scheduling, and constant-time HMAC-SHA256 certificate verification.
  contact:
    name: Truong Van Tinh (TVT Studio)
    url: https://github.com/tvt987/solaris-academy
    email: tinhkun102@gmail.com
servers:
  - url: http://localhost:8000
    description: Local FastAPI Uvicorn Server
  - url: http://localhost:8080
    description: Docker Compose Nginx Reverse Proxy
tags:
  - name: System
    description: Health and engine readiness telemetry
  - name: AST Grader
    description: Zero-eval Python AST security validation and deterministic unit test grading
  - name: System Design Capacity
    description: Back-of-the-envelope QPS, cache-miss Origin DB QPS, pod/replica sizing, 5-year TB storage, CDN egress Gbps, bottleneck flags & monthly cloud cost
  - name: SM-2 Spaced Repetition
    description: Pure SuperMemo-2 interval and ease-factor calculation
  - name: HMAC Certificates
    description: Deterministic HMAC-SHA256 credential issuance and tamper-resistant verification

paths:
  /health:
    get:
      tags: [System]
      summary: Service health and sandbox runtime status
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: solaris-academy-api
                version: 3.0.0
                sandbox_engine: python-ast-zero-eval

  /api/v1/sandbox/grade:
    post:
      tags: [AST Grader]
      summary: Statically validate Python AST safety and grade against unit test cases
      operationId: gradeSandboxSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxGradeRequest'
            example:
              code: |
                def two_sum(nums, target):
                    seen = {}
                    for i, val in enumerate(nums):
                        comp = target - val
                        if comp in seen:
                            return [seen[comp], i]
                        seen[val] = i
                    return []
              function_name: two_sum
              xp_reward: 150
              max_steps: 10000
              test_cases:
                - name: Standard pair
                  args: [[2, 7, 11, 15], 9]
                  expected: [0, 1]
      responses:
        '200':
          description: AST validated and all test cases evaluated deterministically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxGradeResponse'
        '400':
          description: AST security violation (import/exec/eval/open/__dunder__) or syntax error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxErrorResponse'
              example:
                detail:
                  code: AST_SECURITY_VIOLATION
                  message: Submitted Python code violated static AST sandbox security policy.
                  violations:
                    - "Import statement blocked: 'import os'"
        '422':
          description: Request payload validation failure

  /api/v1/srs/review:
    post:
      tags: [SM-2 Spaced Repetition]
      summary: Compute next SuperMemo-2 review interval, Ease Factor, and due date
      operationId: reviewSrsCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sm2ReviewRequest'
            example:
              card_id: fc-dotnet-1
              rating: good
              repetitions: 1
              interval_days: 1
              ease_factor: 2.5
              lapses: 0
              reviewed_at: '2026-11-27T00:00:00Z'
      responses:
        '200':
          description: Updated SM-2 card schedule and next rating previews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sm2ReviewResponse'
        '422':
          description: Invalid rating or out-of-range parameters

  /api/v1/certificates/issue:
    post:
      tags: [HMAC Certificates]
      summary: Issue an HMAC-SHA256 signed completion certificate payload
      operationId: issueCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateIssueRequest'
            example:
              student_name: Truong Van Tinh
              course_code: DN10
              course_title: Full-Stack .NET 10
              issue_date: '2026-11-27'
              honors: true
      responses:
        '200':
          description: Signed certificate metadata and 64-char hex HMAC-SHA256 signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateIssueResponse'

  /api/v1/certificates/verify:
    post:
      tags: [HMAC Certificates]
      summary: Verify certificate authenticity via constant-time HMAC-SHA256 comparison
      operationId: verifyCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateVerifyRequest'
      responses:
        '200':
          description: Constant-time cryptographic verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerifyResponse'

  /api/v1/system-design/capacity:
    post:
      tags: [System Design Capacity]
      summary: Estimate back-of-the-envelope QPS, Origin DB QPS, pod/replica sizing, 5-year TB storage, CDN egress Gbps, tier bottlenecks & monthly cloud cost
      operationId: estimateSystemDesignCapacity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemDesignCapacityRequest'
            example:
              blueprint_id: url-shortener
              dau: 2500000
              read_write_ratio: 80
              peak_multiplier: 6
              cache_hit_ratio_pct: 82
              avg_payload_kb: 4
              runtime: dotnet10
              auto_scale: false
      responses:
        '200':
          description: Deterministic back-of-the-envelope capacity sizing report, 5-tier bottleneck audit & auto-scale target fleet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDesignCapacityResponse'
        '422':
          description: Slider parameter out of valid bounds or unknown blueprint/runtime

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, sandbox_engine]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        sandbox_engine:
          type: string

    SandboxTestCase:
      type: object
      required: [name, expected]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        args:
          type: array
          items: {}
          default: []
        expected: {}

    SandboxGradeRequest:
      type: object
      required: [code, function_name, test_cases]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 25000
        function_name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]*$'
        test_cases:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SandboxTestCase'
        xp_reward:
          type: integer
          minimum: 0
          maximum: 1000
          default: 120
        max_steps:
          type: integer
          minimum: 100
          maximum: 50000
          default: 10000

    SandboxCaseResult:
      type: object
      required: [name, passed, expected, actual, duration_ms]
      properties:
        name:
          type: string
        passed:
          type: boolean
        expected: {}
        actual: {}
        duration_ms:
          type: number
        error:
          type: [string, 'null']

    SandboxGradeResponse:
      type: object
      required:
        - passed_all
        - passed_count
        - total_count
        - score_pct
        - xp_awarded
        - execution_ms
        - ast_nodes_checked
        - steps_executed
        - results
      properties:
        passed_all:
          type: boolean
        passed_count:
          type: integer
        total_count:
          type: integer
        score_pct:
          type: integer
        xp_awarded:
          type: integer
        execution_ms:
          type: number
        ast_nodes_checked:
          type: integer
        steps_executed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SandboxCaseResult'

    SandboxErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message, violations]
          properties:
            code:
              type: string
              enum: [AST_SECURITY_VIOLATION, SANDBOX_SYNTAX_ERROR]
            message:
              type: string
            violations:
              type: array
              items:
                type: string

    Sm2ReviewRequest:
      type: object
      required: [card_id, rating]
      properties:
        card_id:
          type: string
        rating:
          type: string
          enum: [again, hard, good, easy]
        repetitions:
          type: integer
          minimum: 0
          default: 0
        interval_days:
          type: integer
          minimum: 0
          default: 0
        ease_factor:
          type: number
          minimum: 1.3
          maximum: 5.0
          default: 2.5
        lapses:
          type: integer
          minimum: 0
          default: 0
        reviewed_at:
          type: [string, 'null']
          format: date-time

    Sm2ReviewResponse:
      type: object
      required:
        - card_id
        - rating
        - quality
        - repetitions
        - interval_days
        - ease_factor
        - lapses
        - due_at
        - is_mastered
        - next_interval_preview
      properties:
        card_id:
          type: string
        rating:
          type: string
          enum: [again, hard, good, easy]
        quality:
          type: integer
        repetitions:
          type: integer
        interval_days:
          type: integer
        ease_factor:
          type: number
        lapses:
          type: integer
        due_at:
          type: string
          format: date-time
        is_mastered:
          type: boolean
        next_interval_preview:
          type: object
          additionalProperties:
            type: string

    CertificateIssueRequest:
      type: object
      required: [student_name, course_code, course_title, issue_date]
      properties:
        student_name:
          type: string
        course_code:
          type: string
        course_title:
          type: string
        issue_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        honors:
          type: boolean
          default: true

    CertificateIssueResponse:
      type: object
      required:
        - credential_id
        - student_name
        - course_code
        - course_title
        - issue_date
        - honors
        - algorithm
        - signature
        - verification_url
        - issued_at
      properties:
        credential_id:
          type: string
        student_name:
          type: string
        course_code:
          type: string
        course_title:
          type: string
        issue_date:
          type: string
        honors:
          type: boolean
        algorithm:
          type: string
          enum: [HMAC-SHA256]
        signature:
          type: string
          minLength: 64
          maxLength: 64
        verification_url:
          type: string
          format: uri
        issued_at:
          type: string
          format: date-time

    CertificateVerifyRequest:
      type: object
      required:
        - credential_id
        - student_name
        - course_code
        - course_title
        - issue_date
        - honors
        - signature
      properties:
        credential_id:
          type: string
        student_name:
          type: string
        course_code:
          type: string
        course_title:
          type: string
        issue_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        honors:
          type: boolean
        signature:
          type: string
          minLength: 64
          maxLength: 64

    CertificateVerifyResponse:
      type: object
      required: [valid, credential_id, algorithm, reason, verified_at]
      properties:
        valid:
          type: boolean
        credential_id:
          type: string
        algorithm:
          type: string
        reason:
          type: string
        verified_at:
          type: string
          format: date-time

    ProvisionedFleet:
      type: object
      required:
        - cdn_gbps
        - api_gw_nodes
        - app_pods
        - redis_shards
        - db_primary_shards
        - db_read_replicas
      properties:
        cdn_gbps:
          type: number
          minimum: 0.5
          maximum: 10000
        api_gw_nodes:
          type: integer
          minimum: 1
          maximum: 500
        app_pods:
          type: integer
          minimum: 1
          maximum: 5000
        redis_shards:
          type: integer
          minimum: 1
          maximum: 500
        db_primary_shards:
          type: integer
          minimum: 1
          maximum: 200
        db_read_replicas:
          type: integer
          minimum: 1
          maximum: 2000

    SystemDesignCapacityRequest:
      type: object
      required:
        - dau
        - read_write_ratio
        - peak_multiplier
        - cache_hit_ratio_pct
        - avg_payload_kb
      properties:
        blueprint_id:
          type: string
          enum: [url-shortener, flash-sale-voucher, realtime-chat-feed]
          default: url-shortener
        dau:
          type: integer
          minimum: 10000
          maximum: 10000000
        read_write_ratio:
          type: integer
          minimum: 10
          maximum: 100
        peak_multiplier:
          type: integer
          minimum: 3
          maximum: 10
        cache_hit_ratio_pct:
          type: integer
          minimum: 50
          maximum: 98
        avg_payload_kb:
          type: integer
          minimum: 1
          maximum: 64
        runtime:
          type: string
          enum: [dotnet10, go, nodejs]
          default: dotnet10
        provisioned_fleet:
          oneOf:
            - $ref: '#/components/schemas/ProvisionedFleet'
            - type: 'null'
        auto_scale:
          type: boolean
          default: false

    TierHealth:
      type: object
      required:
        - id
        - label
        - load_value
        - capacity_value
        - unit
        - utilization_pct
        - status
        - provisioned_units
        - recommended_units
        - summary
      properties:
        id:
          type: string
          enum: [cdn, api_gateway, app_fleet, redis_cache, database]
        label:
          type: string
        load_value:
          type: number
        capacity_value:
          type: number
        unit:
          type: string
        utilization_pct:
          type: number
        status:
          type: string
          enum: [healthy, warning, overloaded]
        provisioned_units:
          type: number
        recommended_units:
          type: number
        summary:
          type: string

    CostBreakdown:
      type: object
      required: [cdn_usd, api_gw_usd, app_fleet_usd, redis_usd, database_usd, total_monthly_usd]
      properties:
        cdn_usd:
          type: integer
        api_gw_usd:
          type: integer
        app_fleet_usd:
          type: integer
        redis_usd:
          type: integer
        database_usd:
          type: integer
        total_monthly_usd:
          type: integer

    RuntimePodComparison:
      type: object
      required: [dotnet10, go, nodejs]
      properties:
        dotnet10:
          type: integer
        go:
          type: integer
        nodejs:
          type: integer

    SystemDesignCapacityResponse:
      type: object
      required:
        - blueprint_id
        - blueprint_name
        - runtime
        - dau
        - read_write_ratio
        - peak_multiplier
        - cache_hit_ratio_pct
        - avg_payload_kb
        - avg_write_qps
        - avg_read_qps
        - avg_total_qps
        - peak_write_qps
        - peak_read_qps
        - peak_total_qps
        - cache_hit_qps
        - cache_miss_read_qps
        - origin_db_peak_qps
        - required_app_pods
        - runtime_pod_comparison
        - required_db_primary_shards
        - required_db_read_replicas
        - required_redis_shards
        - required_api_gw_nodes
        - required_cdn_gbps
        - daily_storage_gb
        - five_year_raw_storage_tb
        - five_year_replicated_storage_tb
        - peak_cdn_egress_gbps
        - monthly_egress_tb
        - monthly_cloud_cost_usd
        - cost_breakdown
        - tiers
        - bottlenecks
        - overloaded_tiers
        - overall_status
        - provisioned_fleet
        - auto_scaled_fleet
      properties:
        blueprint_id:
          type: string
        blueprint_name:
          type: string
        runtime:
          type: string
          enum: [dotnet10, go, nodejs]
        dau:
          type: integer
        read_write_ratio:
          type: integer
        peak_multiplier:
          type: integer
        cache_hit_ratio_pct:
          type: integer
        avg_payload_kb:
          type: integer
        avg_write_qps:
          type: number
        avg_read_qps:
          type: number
        avg_total_qps:
          type: number
        peak_write_qps:
          type: number
        peak_read_qps:
          type: number
        peak_total_qps:
          type: number
        cache_hit_qps:
          type: number
        cache_miss_read_qps:
          type: number
        origin_db_peak_qps:
          type: number
        required_app_pods:
          type: integer
        runtime_pod_comparison:
          $ref: '#/components/schemas/RuntimePodComparison'
        required_db_primary_shards:
          type: integer
        required_db_read_replicas:
          type: integer
        required_redis_shards:
          type: integer
        required_api_gw_nodes:
          type: integer
        required_cdn_gbps:
          type: number
        daily_storage_gb:
          type: number
        five_year_raw_storage_tb:
          type: number
        five_year_replicated_storage_tb:
          type: number
        peak_cdn_egress_gbps:
          type: number
        monthly_egress_tb:
          type: number
        monthly_cloud_cost_usd:
          type: integer
        cost_breakdown:
          $ref: '#/components/schemas/CostBreakdown'
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/TierHealth'
        bottlenecks:
          type: array
          items:
            type: string
        overloaded_tiers:
          type: array
          items:
            type: string
        overall_status:
          type: string
          enum: [healthy, warning, overloaded]
        provisioned_fleet:
          $ref: '#/components/schemas/ProvisionedFleet'
        auto_scaled_fleet:
          $ref: '#/components/schemas/ProvisionedFleet'
